name: Auto Update Radio Catalogs

on:
  schedule:
    # Запускається щонеділі о 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch: # Дозволяє запустити генерацію вручну з вкладки Actions

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Catalog Generator
        run: python generate_catalogs.py

      - name: Commit and Push Updated Catalogs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Додаємо згенеровані папки країн та жанрів
          git add countries/ genres/
          
          if git diff --staged --quiet; then
            echo "No changes in catalogs."
          else
            git commit -m "chore: auto-update radio stream catalogs [skip ci]"
            git push
          fi
